# Relecto edge node, profile S (checker only). Run from the repository root:
#   cp deploy/.env.example deploy/.env   # then set a strong password
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# The app listens on 127.0.0.1 only. Login (Keycloak) is added in R1 part 2.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relecto
      POSTGRES_USER: relecto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relecto -d relecto"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RELECTO_DATABASE_URL: postgresql+psycopg://relecto:${POSTGRES_PASSWORD}@db:5432/relecto
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
