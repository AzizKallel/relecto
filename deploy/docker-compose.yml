# Relecto edge node: database + web app + AI worker + DICOM receiver.
#   cp deploy/.env.example deploy/.env      # then set the two secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Web app: http://<this machine>:8000 · DICOM: AE RELECTO, port 11112.
x-app: &app
  build:
    context: ..
  image: relecto:latest
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    RELECTO_DATABASE_URL: postgresql+psycopg://relecto:${POSTGRES_PASSWORD}@db:5432/relecto
    RELECTO_SECRET: ${RELECTO_SECRET:?set RELECTO_SECRET in deploy/.env}
    RELECTO_DATA_DIR: /data
    TOTALSEG_HOME_DIR: /models
    RELECTO_DICOM_ALLOWED_AES: ${RELECTO_DICOM_ALLOWED_AES:-}
  volumes:
    - studies:/data
    - models:/models

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relecto
      POSTGRES_USER: relecto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relecto -d relecto"]
      interval: 5s
      retries: 10

  app:
    <<: *app
    command: ["python", "-m", "relecto", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${RELECTO_BIND:-127.0.0.1}:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "relecto", "worker"]
    # The nodule model needs ~7 GB of RAM on CPU: give Docker Desktop at least 10 GB.
    healthcheck:
      disable: true

  dicom:
    <<: *app
    command: ["python", "-m", "relecto", "dicom", "--port", "11112"]
    ports:
      - "${RELECTO_BIND:-127.0.0.1}:11112:11112"
    healthcheck:
      disable: true

volumes:
  pgdata:
  studies:
  models:
